<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Loan Approval Predictor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="container">

    <div class="header">

        <h1>Loan Approval Predictor</h1>


    </div>


    <div class="card">

        <form action="/predict"
              method="POST">


            <h2>Applicant Information</h2>


            <div class="form-grid">


                <div class="form-group">

                    <label>Gender</label>

                    <select name="Gender" required>

                        <option>Select</option>

                        <option value="Male">Male</option>

                        <option value="Female">Female</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Married</label>

                    <select name="Married" required>

                        <option>Select</option>

                        <option value="Yes">Yes</option>

                        <option value="No">No</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Dependents</label>

                    <select name="Dependents" required>

                        <option>Select</option>

                        <option value="0">0</option>

                        <option value="1">1</option>

                        <option value="2">2</option>

                        <option value="3+">3+</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Education</label>

                    <select name="Education" required>

                        <option>Select</option>

                        <option value="Graduate">
                            Graduate
                        </option>

                        <option value="Not Graduate">
                            Not Graduate
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Self Employed</label>

                    <select name="Self_Employed" required>

                        <option>Select</option>

                        <option value="No">No</option>

                        <option value="Yes">Yes</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Property Area</label>

                    <select name="Property_Area" required>

                        <option>Select</option>

                        <option value="Urban">Urban</option>

                        <option value="Semiurban">
                            Semiurban
                        </option>

                        <option value="Rural">Rural</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Applicant Income</label>

                    <input
                        type="number"
                        name="ApplicantIncome"
                        placeholder="e.g. 5000"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Coapplicant Income</label>

                    <input
                        type="number"
                        name="CoapplicantIncome"
                        placeholder="e.g. 1500"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Loan Amount</label>

                    <input
                        type="number"
                        step="0.01"
                        name="LoanAmount"
                        placeholder="e.g. 150"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Loan Term (months)</label>

                    <input
                        type="number"
                        name="Loan_Amount_Term"
                        placeholder="e.g. 360"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Credit History</label>

                    <select name="Credit_History" required>
                        
                        <option>Select</option>
                        
                        <option value="1">
                            Good
                        </option>

                        <option value="0">
                            Poor
                        </option>

                    </select>

                </div>


            </div>


            <button type="submit">

                Predict Loan Approval

            </button>


        </form>


        {% if prediction %}

        <div class="result {{ status }}">

            <h2>{{ prediction }}</h2>

            <p>
                Estimated approval probability:
                <strong>{{ probability }}%</strong>
            </p>

        </div>

        {% endif %}


        {% if error %}

        <div class="result error">

            <h2>Prediction Error</h2>

            <p>{{ error }}</p>

        </div>

        {% endif %}


    </div>


    <div class="footer">

        <p>
            Made by Mitash Sharma 
        </p>

    </div>

</div>


</body>

</html>
